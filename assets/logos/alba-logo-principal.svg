  <line x1="344" y1="146" x2="320" y2="184" stroke="#F59E0B" stroke-width="14" stroke-linecap="round"/>
  <!-- Corchetes angulares de codigo formando estructura 'A' -->
  <path d="M174 206 L104 276 L174 346" fill="none" stroke="url(#codeGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M338 206 L408 276 L338 346" fill="none" stroke="url(#codeGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
