name: Release Multiplataforma (Xynex Code Editor & Cibao 5.0)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica a empaquetar (sin 'v')"
        required: true
        default: "5.0.0"
      incluir_macos:
        description: "Incluir compilación opcional para macOS (.dmg)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    name: Instalador Windows x64 (.exe + .zip)
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determinar versión
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}".TrimStart('v', 'V')
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Ejecutar pruebas unitarias
        run: dotnet test AlbaEcosistema.sln -c Release --verbosity normal

      - name: Instalar Inno Setup 6
        run: choco install innosetup -y

      - name: Compilar Host C++20 y empaquetar instalador .exe + .zip portable
        shell: pwsh
        run: |
          cmake --preset windows-auto
          cmake --build --preset windows-auto --target alba-host
          ./packaging/windows/build-windows-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            dist/*.exe
            dist/*.zip

  build-linux:
    name: Paquetes Linux (.deb, .rpm, .AppImage, .tar.gz)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determinar versión
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas unitarias
        run: dotnet test AlbaEcosistema.sln -c Release --verbosity normal

      - name: Instalar herramientas de empaquetado Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev wget
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool || true
          if [ -f /tmp/appimagetool ]; then chmod +x /tmp/appimagetool; fi

      - name: Generar .deb, .rpm, .AppImage y .tar.gz
        env:
          APPIMAGETOOL: /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          chmod +x packaging/linux/build-linux-packages.sh
          ./packaging/linux/build-linux-packages.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/*.tar.gz

  build-arch:
    name: Paquete Nativo Arch Linux / CachyOS (.pkg.tar.zst)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determinar versión
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Compilar y empaquetar nativamente en Arch Linux
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -e VERSION="${{ steps.ver.outputs.version }}" \
            -e HOST_UID="${HOST_UID}" \
            -e HOST_GID="${HOST_GID}" \
            -v "${GITHUB_WORKSPACE}:/work" \
            archlinux:latest \
            bash -lc '
              set -euo pipefail
              pacman-key --init
              pacman -Sy --noconfirm archlinux-keyring
              pacman -Syu --noconfirm --needed base-devel dotnet-sdk-8.0 cmake gcc zstd
              useradd -m -s /bin/bash builder
              cp -a /work /tmp/arch-src
              chown -R builder:builder /tmp/arch-src
              su - builder -c "cd /tmp/arch-src && dotnet test AlbaEcosistema.sln -c Release --verbosity minimal && chmod +x packaging/arch/build-arch-package.sh && ./packaging/arch/build-arch-package.sh \"$VERSION\""
              mkdir -p /work/dist
              cp /tmp/arch-src/dist/*.pkg.tar.zst /work/dist/
              chown "${HOST_UID}:${HOST_GID}" /work/dist/*.pkg.tar.zst
            '

      - uses: actions/upload-artifact@v4
        with:
          name: installers-arch
          path: dist/*.pkg.tar.zst

  build-macos:
    name: Paquetes macOS opcionales (.dmg)
    if: github.event_name == 'workflow_dispatch' && inputs.incluir_macos
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determinar versión
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas unitarias
        run: dotnet test AlbaEcosistema.sln -c Release

      - name: Generar .app y .dmg (Apple Silicon arm64 e Intel x64)
        run: |
          chmod +x packaging/macos/build-macos-dmg.sh
          ./packaging/macos/build-macos-dmg.sh "${{ steps.ver.outputs.version }}" "arm64"
          ./packaging/macos/build-macos-dmg.sh "${{ steps.ver.outputs.version }}" "x64"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: dist/*.dmg

  publish-release:
    name: Publicar Release en GitHub
    needs: [build-windows, build-linux, build-arch]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolver etiqueta de Release
        id: rel
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ needs.build-windows.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Descargar artefactos generados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generar checksums SHA-256
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publicar o adjuntar instaladores en GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: "Xynex Code Editor & Cibao ${{ steps.rel.outputs.tag }}"
          generate_release_notes: true
          make_latest: true
          files: release-assets/*
