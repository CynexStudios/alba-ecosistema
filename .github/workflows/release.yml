name: Release Multiplataforma (Alba Studio)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión semántica a empaquetar (sin 'v')"
        required: true
        default: "2.0.0"

permissions:
  contents: write

jobs:
  build-windows:
    name: Instalador Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determinar versión
        id: ver
        shell: pwsh
        run: |
          $v = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($v)) {
            $v = "${{ github.ref_name }}".TrimStart('v')
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Ejecutar pruebas
        run: dotnet test AlbaEcosistema.sln -c Release

      - name: Instalar Inno Setup 6
        run: choco install innosetup -y

      - name: Compilar Host C++20 y empaquetar .exe + .zip
        shell: pwsh
        run: |
          cmake --preset windows-auto
          cmake --build --preset windows-auto --target alba-host
          ./packaging/windows/build-windows-installer.ps1 -Version "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            dist/*.exe
            dist/*.zip

  build-macos:
    name: Paquete macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determinar versión
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas
        run: dotnet test AlbaEcosistema.sln -c Release

      - name: Generar .app y .dmg (${{ matrix.arch }})
        run: |
          chmod +x packaging/macos/build-macos-dmg.sh
          ./packaging/macos/build-macos-dmg.sh "${{ steps.ver.outputs.version }}" "${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos-${{ matrix.arch }}
          path: dist/*.dmg

  build-linux:
    name: Paquetes Linux (.deb, .rpm, .AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Determinar versión
        id: ver
        run: |
          VER="${{ github.event.inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME#v}"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Ejecutar pruebas
        run: dotnet test AlbaEcosistema.sln -c Release

      - name: Instalar herramientas de empaquetado Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm dpkg-dev wget
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O /tmp/appimagetool
          chmod +x /tmp/appimagetool

      - name: Generar .deb, .rpm y .AppImage
        env:
          APPIMAGETOOL: /tmp/appimagetool
        run: |
          chmod +x packaging/linux/build-linux-packages.sh
          ./packaging/linux/build-linux-packages.sh "${{ steps.ver.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

  publish-release:
    name: Publicar Release en GitHub
    needs: [build-windows, build-macos, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar artefactos generados
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generar checksums SHA-256
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
